name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: "last updated" dates and sitemap lastmod come from git.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs-src

      # Strict: dead links, missing screenshots and every build check fail the build.
      - name: Build VitePress
        run: npm run build
        working-directory: docs-src
        env:
          DOCS_STRICT: '1'
          SEO_CHECK_DENYLIST_TERMS: ${{ secrets.SEO_CHECK_DENYLIST_TERMS }}

      # The intranet edition is built from the same source on every change so it
      # cannot silently break; it is checked here and never deployed.
      - name: Build the intranet edition (check only)
        run: npx vitepress build --outDir ../.internal-check
        working-directory: docs-src
        env:
          HALO_INTERNAL: '1'
          DOCS_STRICT: '1'
          SEO_CHECK_DENYLIST_TERMS: ${{ secrets.SEO_CHECK_DENYLIST_TERMS }}

      - name: Check the intranet edition
        run: node scripts/seo-check.mjs .internal-check --internal
        env:
          SEO_CHECK_DENYLIST_TERMS: ${{ secrets.SEO_CHECK_DENYLIST_TERMS }}

      - name: Assemble site
        run: ./scripts/assemble-site.sh

      - name: SEO, link and leak check
        run: node scripts/seo-check.mjs dist/docs
        env:
          SEO_CHECK_DENYLIST_TERMS: ${{ secrets.SEO_CHECK_DENYLIST_TERMS }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload site for the haloxe.com mirror
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # haloxe.com mirror: the same files, served by the edge Worker "halo-site".
  deploy-haloxe:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Deploy haloxe.com
        working-directory: haloxe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4.151.1 deploy
